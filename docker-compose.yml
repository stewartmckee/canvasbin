# Local development: Postgres + Canvasbin on http://localhost:8080
#
#   docker compose up --build
#
# For Go/Vite dev loops, start only Postgres (`docker compose up postgres`) and
# run `make dev`.

name: canvasbin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: canvasbin
      POSTGRES_PASSWORD: canvasbin
      POSTGRES_DB: canvasbin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvasbin -d canvasbin"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: stewartmckee/canvasbin:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://canvasbin:canvasbin@postgres:5432/canvasbin?sslmode=disable
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Accounts are off unless ACCOUNTS=on (requires MAILGUN_SENDING_KEY).
      ACCOUNTS: ${ACCOUNTS:-off}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MAILGUN_SENDING_KEY: ${MAILGUN_SENDING_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-canvasbin.dev}
      MAIL_FROM: ${MAIL_FROM:-Canvasbin <noreply@canvasbin.dev>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM_BASE: ${STRIPE_PRICE_TEAM_BASE:-}
      STRIPE_PRICE_TEAM_SEAT: ${STRIPE_PRICE_TEAM_SEAT:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "8080:8080"
    # Chromium's sandbox needs namespaces Docker's default seccomp profile blocks.
    security_opt:
      - seccomp:unconfined

volumes:
  pgdata: {}
